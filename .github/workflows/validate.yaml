name: Validate

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-validate"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PUBLIC_APP_BASE_URL: "http://localhost:3000"
      PUBLIC_REDMINE_ID: ${{ vars.SERVICE_ID || '11419' }}

    strategy:
      fail-fast: true
      matrix:
        node-version: [26.x]
        os: [ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Cache astro build artefacts
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/
          key: ${{ runner.os }}-astro-${{ matrix.node-version }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-astro-${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run types:check

      - name: Test
        run: pnpm run test

      - name: Get playwright version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --raw-output '.[0].devDependencies["@playwright/test"].version')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache playwright browsers
        uses: actions/cache@v6
        id: cache-playwright-browsers
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ matrix.os }}-playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}"

      - name: Install playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Install playwright browsers (operating system dependencies)
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Build app
        run: pnpm run build

      - name: Run e2e tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker-smoke:
    name: Test Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without a host Astro cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: amc-website:smoke
          build-args: |
            PUBLIC_APP_BASE_URL=http://localhost:3000
            PUBLIC_REDMINE_ID=11419
          secrets: |
            KEYSTATIC_SECRET=amc-build-secret-sentinel
          cache-from: type=gha,scope=amc-smoke
          cache-to: type=gha,scope=amc-smoke,mode=max

      - name: Smoke-test running container
        run: node scripts/smoke-image.mjs amc-website:smoke

  build-deploy:
    if: ${{ github.event_name == 'push' }}
    needs: [validate, docker-smoke]
    uses: ./.github/workflows/build-deploy.yaml
    secrets: inherit
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#access-and-permissions
    permissions:
      contents: read
      packages: write
